name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare website files
        run: |
          mkdir -p _site
          git ls-files -z index.html .nojekyll css js data dados_oficiais/legislacao |
            while IFS= read -r -d '' file; do
              case "$file" in
                data/*.gpkg|data/declividade_sao_roque.geojson) continue ;;
              esac
              mkdir -p "_site/$(dirname "$file")"
              cp "$file" "_site/$file"
            done

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
